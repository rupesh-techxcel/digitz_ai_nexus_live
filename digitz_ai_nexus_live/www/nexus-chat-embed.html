<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexus Chat Embed</title>
  <!-- Define frappe before Frappe injects the csrf_token script below, otherwise
       `frappe.csrf_token = "..."` throws "frappe is not defined" and breaks boot. -->
  <script>window.frappe = window.frappe || {};</script>
  <!-- csrf_token -->
  {% if widget_valid %}
  <script>
    window.NexusChatConfig = {
      tenant: "{{ widget_tenant }}",
      channel: "{{ widget_channel }}",
      widget_code: "{{ widget_code }}",
      storage_key: "{{ widget_code }}",
      knowledge_delivery_enabled: {{ knowledge_delivery_enabled }}
    };
    window.dev_server = {{ dev_server }};
    window.socketio_port = {{ socketio_port }};
    // This page is only ever loaded as an external cross-site embed, so the widget
    // must always run in public-visitor mode (never desk), even if a nexusailive.com
    // session leaks into the iframe. Keeps the "Connect with Nexy" picker visible.
    window.NEXUS_FORCE_PUBLIC = true;
    window.frappe = window.frappe || {};
    frappe.boot = {
      sitename: "{{ sitename }}",
      socketio_port: {{ socketio_port }}
    };
    frappe.ready_events = [];
    frappe.ready = function(fn) { frappe.ready_events.push(fn); };
  </script>
  {% endif %}
  <style>
    html,
    body {
      background: transparent;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }
  </style>
</head>
<body>
  {% if widget_valid %}
  {{ include_script('frappe-web.bundle.js') }}
  {{ include_script('nexus_chat_widget.bundle.js') }}
  <script>
    (function() {
      var parentOrigin = "{{ parent_origin }}";

      function panelIsOpen() {
        var panel = document.getElementById("ncw-panel");
        return !!panel && panel.style.display !== "none";
      }

      function postState() {
        window.parent.postMessage({
          source: "nexus-chat-embed",
          state: panelIsOpen() ? "open" : "closed"
        }, parentOrigin);
      }

      function openChat() {
        var panel = document.getElementById("ncw-panel");
        if (panel && panel.style.display !== "none") {
          postState();
          return;
        }

        var bubble = document.getElementById("ncw-bubble");
        if (bubble) {
          bubble.click();
          postState();
        }
      }

      function bindObserver() {
        var root = document.getElementById("ncw-root");
        var panel = document.getElementById("ncw-panel");

        if (!root || !panel) {
          setTimeout(bindObserver, 150);
          return;
        }

        new MutationObserver(postState).observe(panel, {
          attributes: true,
          attributeFilter: ["style", "class"]
        });

        postState();
      }

      function applyVisitorContext(data) {
        // Ids must match the server-side formats (visitor_tracking_service.py)
        var vid = (typeof data.visitor_id === "string" && /^nv_[a-f0-9]{24}$/.test(data.visitor_id))
          ? data.visitor_id : null;
        var sid = (typeof data.session_id === "string" && /^ns_[a-f0-9]{16}$/.test(data.session_id))
          ? data.session_id : null;
        if (!vid && !sid) return;

        function trunc(val, max) {
          return typeof val === "string" ? val.slice(0, max) : "";
        }

        window.NexusContext = {
          visitor_id: vid,
          session_id: sid,
          page_url:   trunc(data.page_url, 1024),
          page_title: trunc(data.page_title, 512),
          referrer:   trunc(data.referrer, 1024),
          source:     "external"
        };
        if (typeof window.getNexusVisitorContext !== "function") {
          window.getNexusVisitorContext = function() {
            return window.NexusContext || {};
          };
        }
      }

      window.addEventListener("message", function(event) {
        var data = event.data || {};
        if (event.origin !== parentOrigin || data.source !== "nexus-external-site") {
          return;
        }

        if (data.action === "open-chat") {
          openChat();
        } else if (data.action === "visitor-context") {
          applyVisitorContext(data);
        }
      });

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", bindObserver);
      } else {
        bindObserver();
      }
    })();
  </script>
  {% else %}
  <script>
    window.parent.postMessage({
      source: "nexus-chat-embed",
      state: "unavailable"
    }, "*");
  </script>
  {% endif %}
</body>
</html>
